# Render Blueprint — alternative to nixpacks.toml for Render.com.
# Railway uses nixpacks.toml; Render prefers render.yaml.
# Both work because we declare the same phases; pick the host that fits.

services:
  - type: web
    name: household-saas
    runtime: php
    plan: starter
    buildCommand: |
      composer install --no-dev --optimize-autoloader --no-interaction &&
      npm ci &&
      npm run build &&
      php artisan config:cache &&
      php artisan route:cache &&
      php artisan view:cache
    startCommand: |
      php artisan storage:link &&
      php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService: { type: web, name: household-saas, property: host }
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase: { name: household_saas_db, property: host }
      - key: DB_PORT
        fromDatabase: { name: household_saas_db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: household_saas_db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: household_saas_db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: household_saas_db, property: password }
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: log    # change to `mailtrap` + add MAILTRAP_HOST / MAILTRAP_API_KEY for production (see docs/MAIL_SETUP.md)
      - key: FILESYSTEM_DISK
        value: s3

databases:
  - name: household_saas_db
    databaseName: household_saas
    user: household_saas
    plan: starter

# Nixpacks build configuration for Railway / Render / Fly.io.
# Pins PHP + Node versions, runs composer + npm + Vite build, then boots Laravel.
# See docs/RAILWAY_DEPLOY.md for context (especially the Alpine.js dropdown
# that silently breaks if `npm run build` is skipped).

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.gd", "php82Extensions.zip", "php82Extensions.intl", "php82Extensions.exif", "php82Extensions.bcmath", "php82Extensions.opcache", "nodejs_20", "composer"]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
# Migrate on every release, then boot the dev server. For real prod traffic
# swap `artisan serve` for nginx + php-fpm (custom Dockerfile).
cmd = "php artisan migrate --force && php artisan storage:link && php artisan serve --host 0.0.0.0 --port ${PORT:-8000}"

# Schedule:
#   - Railway: add a separate Cron service running `php artisan schedule:run` every minute.
#   - Render: use the Cron Job add-on.
#   - Heroku: add `scheduler` to Procfile (already done — see Procfile).
#   - Single-dyno dev: replace `serve` with `php artisan schedule:work & php artisan serve ...`
#     (foreground schedule:work keeps the in-process scheduler running).
